# Publica o frontend (Vite + React) no GitHub Pages a cada push na main
# URL: https://fariazk11.github.io/404_burguwe/
name: Deploy do frontend no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; um deploy novo cancela o que estiver na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build
        env:
          # Endereço do backend em produção. Configure em
          # Settings → Secrets and variables → Actions → Variables → VITE_API_URL.
          # Sem a variável, o site usa http://localhost:3333.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # O GitHub Pages não conhece as rotas do React Router: ao abrir /404_burguwe/login
      # direto, ele procura o 404.html. Como ele é uma cópia do index.html, o React carrega
      # e mostra a página certa.
      - name: Copiar index.html para 404.html
        run: cp dist/index.html dist/404.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
